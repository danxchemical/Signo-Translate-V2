<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signo Translate - Teclado Inteligente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #D1A68B 0%, #c19a7a 25%, #b8926f 50%, #af8a64 75%, #a68259 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .back-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            margin-right: 15px;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.2rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-3px);
        }

        .header-content {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .mode-selector {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease-out;
        }

        .mode-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 12px 25px;
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #D1A68B, #c19a7a);
            box-shadow: 0 5px 15px rgba(209, 166, 139, 0.4);
        }

        .text-area-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .text-area-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .text-area-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .char-counter {
            color: #666;
            font-size: 0.9rem;
        }

        #text-display {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #D1A68B;
            border-radius: 15px;
            background: white;
            resize: vertical;
            font-family: inherit;
            line-height: 1.5;
            transition: all 0.3s ease;
        }

        #text-display:focus {
            outline: none;
            border-color: #c19a7a;
            box-shadow: 0 0 15px rgba(209, 166, 139, 0.3);
        }

        .text-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .text-control-btn {
            padding: 10px 20px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .text-control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        .text-control-btn.voice {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
        }

        .text-control-btn.voice:hover {
            box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4);
        }

        .text-control-btn.recording {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .sequence-display {
            min-height: 180px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            border: 2px dashed #D1A68B;
            margin-top: 15px;
        }

        .sequence-display.empty::after {
            content: 'Las señas aparecerán aquí...';
            color: #999;
            font-style: italic;
            font-size: 1.1rem;
        }

        .sign-card {
            width: 90px;
            height: 110px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            animation: signAppear 0.5s ease-out;
        }

        @keyframes signAppear {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .sign-card:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .sign-card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
        }

        .sign-card .letter-label {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #D1A68B, #c19a7a);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .sign-card.space {
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
        }

        .sign-card.space .letter-label {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            font-size: 0.75rem;
        }

        .keyboard-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .keyboard-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        #keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 12px;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .key {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #D1A68B, #c19a7a);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(209, 166, 139, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .key:hover::before {
            left: 100%;
        }

        .key:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(209, 166, 139, 0.4);
            background: linear-gradient(145deg, #c19a7a, #b8926f);
        }

        .key:active {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(209, 166, 139, 0.3);
        }

        .key img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            pointer-events: none;
            object-position: center;
        }

        .key::after {
            content: attr(data-letter);
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
            white-space: nowrap;
        }

        .key:hover::after {
            opacity: 1;
        }

        .controls-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 25px;
            background: linear-gradient(45deg, #D1A68B, #c19a7a);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(209, 166, 139, 0.3);
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .control-btn:hover::before {
            left: 100%;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(209, 166, 139, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .clear-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }

        .clear-btn:hover {
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
        }

        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg); 
                opacity: 0.3; 
            }
            50% { 
                transform: translateY(-20px) rotate(180deg); 
                opacity: 0.8; 
            }
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            #keyboard {
                grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
                gap: 8px;
            }
            
            .key {
                width: 60px;
                height: 60px;
            }
            
            .sign-card {
                width: 75px;
                height: 95px;
            }

            .sign-card img {
                height: 60px;
            }

            .sign-card .letter-label {
                height: 35px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .text-area-container,
            .keyboard-container,
            .mode-selector {
                padding: 20px;
            }
            
            #keyboard {
                grid-template-columns: repeat(auto-fit, minmax(55px, 1fr));
                gap: 6px;
            }
            
            .key {
                width: 55px;
                height: 55px;
            }
            
            .sign-card {
                width: 65px;
                height: 85px;
            }
        }

        .typing-effect {
            animation: typing 0.3s ease-out;
        }

        @keyframes typing {
            0% {
                transform: scale(1.1);
                background: rgba(209, 166, 139, 0.2);
            }
            100% {
                transform: scale(1);
                background: white;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="particle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 60%; left: 80%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 30%; left: 50%; animation-delay: 4s;"></div>
    <div class="particle" style="top: 80%; left: 20%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 10%; left: 70%; animation-delay: 3s;"></div>

    <header class="header">
        <a class="back-button" href="inicio.html">←</a>
        <div class="header-content">
            <h1>Teclado Inteligente</h1>
            <p id="header-subtitle">👁️ Selecciona las señas para formar palabras</p>
        </div>
    </header>

    <main class="main-container">
        <div class="mode-selector">
            <div class="mode-title">🔄 Modo de Traducción</div>
            <div class="mode-buttons">
                <button class="mode-btn active" onclick="changeMode('signs-to-text')" data-mode="signs-to-text">
                    🤟 Señas → Texto
                </button>
                <button class="mode-btn" onclick="changeMode('text-to-signs')" data-mode="text-to-signs">
                    📝 Texto → Señas
                </button>
                <button class="mode-btn" onclick="changeMode('voice-to-signs')" data-mode="voice-to-signs">
                    🎤 Voz → Señas
                </button>
            </div>
        </div>

        <div class="text-area-container">
            <div class="text-area-header">
                <div class="text-area-title" id="text-area-title">💬 Tu mensaje</div>
                <div class="char-counter">0/500 caracteres</div>
            </div>
            <textarea id="text-display" placeholder="Toca las señas del teclado para escribir..." maxlength="500"></textarea>
            
            <div class="text-controls">
                <button class="text-control-btn" id="convert-btn" onclick="convertToSigns()">
                    ✨ Convertir a Señas
                </button>
                <button class="text-control-btn voice" id="voice-btn" onclick="toggleVoiceRecognition()">
                    🎤 Usar Micrófono
                </button>
                <button class="text-control-btn" onclick="speakText()">
                    🔊 Escuchar Texto
                </button>
                <button class="text-control-btn" onclick="copyText()">
                    📋 Copiar Texto
                </button>
            </div>

            <div id="sequence-container" class="hidden">
                <div class="sequence-display empty" id="sequenceDisplay"></div>
            </div>
        </div>

        <div class="keyboard-container" id="keyboard-section">
            <div class="keyboard-title">🤟 Teclado de Lenguaje de Señas</div>
            <div id="keyboard"></div>
            
            <div class="controls-container">
                <button class="control-btn" onclick="addSpace()">➕ Espacio</button>
                <button class="control-btn" onclick="deleteLastChar()">⌫ Borrar</button>
                <button class="control-btn clear-btn" onclick="clearAll()">🗑️ Limpiar Todo</button>
            </div>
        </div>
    </main>

    <script>
        const signLanguageImages = {
            'A': 'img/abecedario/a.jpg',
            'B': 'img/abecedario/b.jpg',
            'C': 'img/abecedario/c.jpg',
            'D': 'img/abecedario/d.jpg',
            'E': 'img/abecedario/e.jpg',
            'F': 'img/abecedario/f.jpg',
            'G': 'img/abecedario/g.jpg',
            'H': 'img/abecedario/h.jpg',
            'I': 'img/abecedario/i.jpg',
            'J': 'img/abecedario/j.jpg',
            'K': 'img/abecedario/k.jpg',
            'L': 'img/abecedario/l.jpg',
            'M': 'img/abecedario/m.jpg',
            'N': 'img/abecedario/n.jpg',
            'Ñ': 'img/abecedario/nn.jpg',
            'O': 'img/abecedario/o.jpg',
            'P': 'img/abecedario/p.jpg',
            'Q': 'img/abecedario/q.jpg',
            'R': 'img/abecedario/r.jpg',
            'S': 'img/abecedario/s.jpg',
            'T': 'img/abecedario/t.jpg',
            'U': 'img/abecedario/u.jpg',
            'V': 'img/abecedario/v.jpg',
            'W': 'img/abecedario/w.jpg',
            'X': 'img/abecedario/x.jpg',
            'Y': 'img/abecedario/y.jpg',
            'Z': 'img/abecedario/z.jpg'
        };

        const alphabet = Object.keys(signLanguageImages);
        const textDisplay = document.getElementById('text-display');
        const keyboard = document.getElementById('keyboard');
        const charCounter = document.querySelector('.char-counter');
        const sequenceDisplay = document.getElementById('sequenceDisplay');
        const sequenceContainer = document.getElementById('sequence-container');
        const keyboardSection = document.getElementById('keyboard-section');

        let currentMode = 'signs-to-text';
        let recognition = null;
        let isRecording = false;

        function changeMode(mode) {
            currentMode = mode;
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
            
            const convertBtn = document.getElementById('convert-btn');
            const voiceBtn = document.getElementById('voice-btn');
            const headerSubtitle = document.getElementById('header-subtitle');
            const textAreaTitle = document.getElementById('text-area-title');
            
            if (mode === 'signs-to-text') {
                keyboardSection.classList.remove('hidden');
                sequenceContainer.classList.add('hidden');
                convertBtn.classList.add('hidden');
                voiceBtn.classList.add('hidden');
                textDisplay.placeholder = 'Toca las señas del teclado para escribir...';
                headerSubtitle.textContent = '👁️ Selecciona las señas para formar palabras';
                textAreaTitle.textContent = '💬 Tu mensaje';
            } else if (mode === 'text-to-signs') {
                keyboardSection.classList.add('hidden');
                sequenceContainer.classList.remove('hidden');
                convertBtn.classList.remove('hidden');
                voiceBtn.classList.add('hidden');
                textDisplay.placeholder = 'Escribe tu texto aquí y conviértelo a señas...';
                headerSubtitle.textContent = '📝 Escribe texto para convertirlo en señas';
                textAreaTitle.textContent = '✍️ Escribe tu texto';
            } else if (mode === 'voice-to-signs') {
                keyboardSection.classList.add('hidden');
                sequenceContainer.classList.remove('hidden');
                convertBtn.classList.add('hidden');
                voiceBtn.classList.remove('hidden');
                textDisplay.placeholder = 'Usa el micrófono para hablar y convertir a señas...';
                headerSubtitle.textContent = '🎤 Habla para convertir tu voz en señas';
                textAreaTitle.textContent = '🎙️ Tu mensaje de voz';
            }
            
            clearSequence();
        }

        function generateKeyboard() {
            keyboard.innerHTML = '';
            
            alphabet.forEach(letter => {
                const key = document.createElement('button');
                key.className = 'key';
                key.onclick = () => addLetter(letter);
                key.setAttribute('data-letter', letter);
                
                const img = document.createElement('img');
                img.src = signLanguageImages[letter];
                img.alt = `Seña para la letra ${letter}`;
                img.title = `Letra ${letter} en lenguaje de señas`;
                
                img.onerror = function() {
                    this.style.display = 'none';
                    key.innerHTML = `
                        <div style="
                            width: 100%; 
                            height: 100%; 
                            display: flex; 
                            align-items: center; 
                            justify-content: center; 
                            background: rgba(255,255,255,0.2); 
                            border-radius: 8px;
                            flex-direction: column;
                            color: white;
                        ">
                            <span style="font-size: 1.5rem; font-weight: bold;">${letter}</span>
                            <span style="font-size: 0.7rem; opacity: 0.8;">🤟</span>
                        </div>
                    `;
                    key.setAttribute('data-letter', letter);
                };
                
                key.appendChild(img);
                keyboard.appendChild(key);
            });
        }

        function addLetter(letter) {
            if (textDisplay.value.length < 500) {
                textDisplay.value += letter;
                textDisplay.classList.add('typing-effect');
                updateCharCounter();
                
                setTimeout(() => {
                    textDisplay.classList.remove('typing-effect');
                }, 300);
            }
        }

        function addSpace() {
            if (textDisplay.value.length < 500) {
                textDisplay.value += ' ';
                updateCharCounter();
            }
        }

        function deleteLastChar() {
            if (textDisplay.value.length > 0) {
                textDisplay.value = textDisplay.value.slice(0, -1);
                updateCharCounter();
            }
        }

        function clearAll() {
            if (textDisplay.value.trim() || sequenceDisplay.children.length > 0) {
                if (confirm('¿Estás seguro de que quieres limpiar todo?')) {
                    textDisplay.value = '';
                    updateCharCounter();
                    clearSequence();
                }
            }
        }

        function clearSequence() {
            sequenceDisplay.innerHTML = '';
            sequenceDisplay.classList.add('empty');
        }

        function convertToSigns() {
            const text = textDisplay.value.toUpperCase().trim();
            
            if (!text) {
                showNotification('⚠️ Escribe algo primero');
                return;
            }

            clearSequence();
            sequenceDisplay.classList.remove('empty');

            let delay = 0;
            for (let char of text) {
                if (char === ' ') {
                    const spaceCard = createSpaceCard();
                    setTimeout(() => {
                        sequenceDisplay.appendChild(spaceCard);
                    }, delay);
                    delay += 100;
                } else if (signLanguageImages[char]) {
                    const card = createSignCard(char);
                    setTimeout(() => {
                        sequenceDisplay.appendChild(card);
                    }, delay);
                    delay += 100;
                }
            }

            if (sequenceDisplay.children.length === 0) {
                sequenceDisplay.classList.add('empty');
                showNotification('⚠️ No hay letras válidas para convertir');
            } else {
                showNotification('✅ Texto convertido a señas');
            }
        }

        function createSignCard(letter) {
            const card = document.createElement('div');
            card.className = 'sign-card';
            
            const img = document.createElement('img');
            img.src = signLanguageImages[letter];
            img.alt = `Seña ${letter}`;
            
            img.onerror = function() {
                this.style.display = 'none';
                const placeholder = document.createElement('div');
                placeholder.style.cssText = `
                    width: 100%;
                    height: 70px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #f0f0f0;
                    font-size: 2rem;
                    color: #999;
                `;
                placeholder.textContent = '🤟';
                card.insertBefore(placeholder, card.firstChild);
            };
            
            const label = document.createElement('div');
            label.className = 'letter-label';
            label.textContent = letter;
            
            card.appendChild(img);
            card.appendChild(label);
            
            return card;
        }

        function createSpaceCard() {
            const card = document.createElement('div');
            card.className = 'sign-card space';
            
            const spacer = document.createElement('div');
            spacer.style.cssText = `
                width: 100%;
                height: 70px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2.5rem;
                color: #7f8c8d;
            `;
            spacer.textContent = '␣';
            
            const label = document.createElement('div');
            label.className = 'letter-label';
            label.textContent = 'ESPACIO';
            
            card.appendChild(spacer);
            card.appendChild(label);
            
            return card;
        }

        function toggleVoiceRecognition() {
            if (isRecording) {
                stopRecording();
            } else {
                startVoiceRecognition();
            }
        }

        function startVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showNotification('❌ Tu navegador no soporta reconocimiento de voz');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const voiceBtn = document.getElementById('voice-btn');

            recognition.onstart = function() {
                isRecording = true;
                voiceBtn.textContent = '⏹️ Detener Grabación';
                voiceBtn.classList.add('recording');
                showNotification('🎤 Grabando... Habla ahora');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                textDisplay.value = transcript;
                updateCharCounter();
                showNotification('✅ Audio convertido a texto');
                
                setTimeout(() => {
                    convertToSigns();
                }, 500);
            };

            recognition.onerror = function(event) {
                let errorMsg = 'Error en el reconocimiento';
                if (event.error === 'no-speech') {
                    errorMsg = '❌ No se detectó ninguna voz';
                } else if (event.error === 'audio-capture') {
                    errorMsg = '❌ No se pudo acceder al micrófono';
                } else if (event.error === 'not-allowed') {
                    errorMsg = '❌ Permiso de micrófono denegado';
                }
                showNotification(errorMsg);
                stopRecording();
            };

            recognition.onend = function() {
                stopRecording();
            };

            try {
                recognition.start();
            } catch (error) {
                showNotification('❌ Error al iniciar el reconocimiento de voz');
                stopRecording();
            }
        }

        function stopRecording() {
            if (recognition) {
                recognition.stop();
            }
            isRecording = false;
            const voiceBtn = document.getElementById('voice-btn');
            voiceBtn.textContent = '🎤 Usar Micrófono';
            voiceBtn.classList.remove('recording');
        }

        function copyText() {
            if (textDisplay.value.trim()) {
                navigator.clipboard.writeText(textDisplay.value).then(() => {
                    showNotification('✅ Texto copiado al portapapeles');
                }).catch(() => {
                    textDisplay.select();
                    document.execCommand('copy');
                    showNotification('✅ Texto copiado');
                });
            } else {
                showNotification('⚠️ No hay texto para copiar');
            }
        }

        function speakText() {
            if (textDisplay.value.trim()) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance(textDisplay.value);
                    utterance.lang = 'es-ES';
                    utterance.rate = 0.9;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    
                    utterance.onstart = function() {
                        showNotification('🔊 Reproduciendo texto...');
                    };
                    
                    utterance.onend = function() {
                        showNotification('✅ Reproducción completada');
                    };
                    
                    utterance.onerror = function() {
                        showNotification('❌ Error al reproducir el audio');
                    };
                    
                    window.speechSynthesis.speak(utterance);
                } else {
                    showNotification('❌ Tu navegador no soporta síntesis de voz');
                }
            } else {
                showNotification('⚠️ No hay texto para reproducir');
            }
        }

        function updateCharCounter() {
            const count = textDisplay.value.length;
            charCounter.textContent = `${count}/500 caracteres`;
            
            if (count > 450) {
                charCounter.style.color = '#e74c3c';
            } else if (count > 400) {
                charCounter.style.color = '#f39c12';
            } else {
                charCounter.style.color = '#666';
            }
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(45deg, #D1A68B, #c19a7a);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                z-index: 1000;
                animation: slideInRight 0.3s ease-out;
                font-weight: bold;
                max-width: 300px;
            `;
            notification.textContent = message;
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
            `;
            
            if (!document.getElementById('notification-styles')) {
                style.id = 'notification-styles';
                document.head.appendChild(style);
            }
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideInRight 0.3s ease-out reverse';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 8 + 's';
            particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 8000);
        }

        textDisplay.addEventListener('input', updateCharCounter);
        
        textDisplay.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                addSpace();
                e.preventDefault();
            }
        });

        generateKeyboard();
        updateCharCounter();
        setInterval(createParticle, 4000);

        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.animation = 'fadeIn 1s ease-out forwards';
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeIn {
                    to { opacity: 1; }
                }
            `;
            document.head.appendChild(style);
        });

        window.addEventListener('beforeunload', function() {
            if (recognition && isRecording) {
                recognition.stop();
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
        });
    </script>
</body>
</html>
